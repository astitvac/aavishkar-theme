<!--
  Proofline Preview Section for Homepage
  Usage: Copy this HTML into a Divi Code module
  Updated: 2026-01-28 - Unified DAG visual matching Proofline page structure
  Adapted for dark purple background with lighter pink colors for visibility
-->
<div class="aav-proofline-grid">
  <!-- Left: Content -->
  <div class="aav-proofline-content">
    <div class="aav-eyebrow">We are building</div>
    <h2 class="aav-h2">Proofline</h2>
    <p class="aav-lead">Our first realization of the Knowledge IDE vision. Proofline helps R&D teams capture hypotheses, evidence, and decisions—connecting them into a scientific engine that turns scattered work into verifiable knowledge.</p>

    <div class="aav-cta-row">
      <a class="aav-btn aav-btn-primary" href="/proofline/">Explore Proofline →</a>
      <a class="aav-btn aav-btn-ghost" href="https://www.youtube.com/watch?v=KT6eyadQfIg" target="_blank" rel="noopener">See Demo ▸</a>
    </div>
  </div>

  <!-- Right: Visual -->
  <div class="aav-proofline-visual">
    <div class="aav-proofline-visual-card">
      <svg viewBox="0 0 360 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Proofline knowledge graph visualization">
        <defs>
          <!-- Card shadow filter (dark background optimized) -->
          <filter id="homepage-dag-card-shadow" x="-10%" y="-10%" width="120%" height="130%">
            <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="rgba(255,255,255,0.12)"/>
          </filter>

          <!-- Node glow filter (dark background optimized) -->
          <filter id="homepage-dag-glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <!-- Header: Proofline title -->
        <g>
          <circle cx="32" cy="20" r="5" fill="#d89fe0"/>
          <text x="44" y="25" fill="#fff" font-family="dinmedium, Arial, sans-serif" font-size="14" font-weight="600">Proofline</text>
        </g>

        <!-- ========== MAIN SPINE (x=32) ========== -->
        <!-- Segment: IDEA to EVIDENCE -->
        <line x1="32" y1="60" x2="32" y2="88" stroke="#d89fe0" stroke-width="3" stroke-linecap="round"/>
        <!-- Segment: EVIDENCE to HYPOTHESIS -->
        <line x1="32" y1="108" x2="32" y2="148" stroke="#d89fe0" stroke-width="3" stroke-linecap="round"/>
        <!-- Segment: HYPOTHESIS to INSIGHT -->
        <line x1="32" y1="168" x2="32" y2="208" stroke="#d89fe0" stroke-width="3" stroke-linecap="round"/>

        <!-- ========== RIGHT BRANCH (ALT HYPOTHESIS) ========== -->
        <!-- Horizontal from EVIDENCE going RIGHT -->
        <line x1="40" y1="98" x2="210" y2="98" stroke="#d89fe0" stroke-width="3" stroke-linecap="round"/>
        <!-- Vertical down to ALT HYPOTHESIS node -->
        <line x1="210" y1="98" x2="210" y2="148" stroke="#d89fe0" stroke-width="3" stroke-linecap="round"/>
        <!-- Vertical from ALT HYPOTHESIS down to INSIGHT (dotted = learnings merge) -->
        <line x1="210" y1="168" x2="210" y2="218" stroke="#d89fe0" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 4"/>
        <!-- Horizontal from right back to INSIGHT (dotted) -->
        <line x1="210" y1="218" x2="42" y2="218" stroke="#d89fe0" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 4"/>

        <!-- ========== ROW 1: IDEA (y=40) ========== -->
        <g transform="translate(0, 40)">
          <circle cx="32" cy="14" r="7" fill="#fff" stroke="#d89fe0" stroke-width="2.5"/>
          <circle cx="32" cy="14" r="2.5" fill="#d89fe0"/>
          <!-- Opaque backdrop to hide lines behind card -->
          <rect x="48" y="-2" width="84" height="36" rx="8" fill="rgba(111, 45, 189, 0.85)"/>
          <g filter="url(#homepage-dag-card-shadow)">
            <rect x="50" y="0" width="80" height="32" rx="7" fill="rgba(255,255,255,0.18)"/>
          </g>
          <rect x="58" y="7" width="64" height="18" rx="4" fill="rgba(216, 159, 224, 0.25)"/>
          <text x="90" y="20" fill="#fff" font-family="dinmedium, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle">IDEA</text>
        </g>

        <!-- ========== ROW 2: EVIDENCE (y=84) ========== -->
        <g transform="translate(0, 84)">
          <circle cx="32" cy="14" r="7" fill="#fff" stroke="#c89fd8" stroke-width="2.5"/>
          <circle cx="32" cy="14" r="2.5" fill="#c89fd8"/>
          <!-- Opaque backdrop to hide lines behind card -->
          <rect x="48" y="-2" width="84" height="36" rx="8" fill="rgba(111, 45, 189, 0.85)"/>
          <g filter="url(#homepage-dag-card-shadow)">
            <rect x="50" y="0" width="80" height="32" rx="7" fill="rgba(255,255,255,0.18)"/>
          </g>
          <rect x="58" y="7" width="64" height="18" rx="4" fill="rgba(200, 159, 216, 0.25)"/>
          <text x="90" y="20" fill="#fff" font-family="dinmedium, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle">EVIDENCE</text>
        </g>

        <!-- ========== ROW 3: BOTH HYPOTHESES (y=140) ========== -->
        <g transform="translate(0, 140)">
          <!-- MAIN HYPOTHESIS on LEFT (main spine) -->
          <circle cx="32" cy="14" r="7" fill="#fff" stroke="#b88fd0" stroke-width="2.5"/>
          <circle cx="32" cy="14" r="2.5" fill="#b88fd0"/>
          <!-- Opaque backdrop to hide lines behind card -->
          <rect x="48" y="-2" width="84" height="36" rx="8" fill="rgba(111, 45, 189, 0.85)"/>
          <g filter="url(#homepage-dag-card-shadow)">
            <rect x="50" y="0" width="80" height="32" rx="7" fill="rgba(255,255,255,0.18)"/>
          </g>
          <rect x="58" y="7" width="64" height="18" rx="4" fill="rgba(184, 143, 208, 0.25)"/>
          <text x="90" y="20" fill="#fff" font-family="dinmedium, Arial, sans-serif" font-size="9" font-weight="600" text-anchor="middle">HYPOTHESIS</text>

          <!-- ALT HYPOTHESIS on RIGHT (branch, invalidated) -->
          <circle cx="210" cy="14" r="7" fill="#fff" stroke="#b88fd0" stroke-width="2.5"/>
          <circle cx="210" cy="14" r="2.5" fill="#b88fd0"/>
          <!-- X mark in circle - LEFT of card -->
          <circle cx="228" cy="14" r="9" fill="rgba(239, 68, 68, 0.2)"/>
          <path d="M224 10 L232 18 M232 10 L224 18" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
          <!-- Opaque backdrop to hide lines behind ALT card -->
          <rect x="243" y="-2" width="84" height="36" rx="8" fill="rgba(111, 45, 189, 0.85)"/>
          <!-- ALT card -->
          <g filter="url(#homepage-dag-card-shadow)">
            <rect x="245" y="0" width="80" height="32" rx="7" fill="rgba(255,255,255,0.18)"/>
          </g>
          <rect x="253" y="7" width="44" height="18" rx="4" fill="rgba(184, 143, 208, 0.2)"/>
          <text x="275" y="20" fill="#fff" font-family="dinmedium, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle">ALT</text>
        </g>

        <!-- ========== ROW 4: INSIGHT (y=196) ========== -->
        <g transform="translate(0, 196)">
          <!-- Glowing node -->
          <g filter="url(#homepage-dag-glow)">
            <circle cx="32" cy="14" r="10" fill="#d89fe0"/>
          </g>
          <circle cx="32" cy="14" r="5" fill="#fff"/>
          <!-- Opaque backdrop to hide lines behind card -->
          <rect x="48" y="-2" width="84" height="36" rx="8" fill="rgba(111, 45, 189, 0.85)"/>
          <g filter="url(#homepage-dag-card-shadow)">
            <rect x="50" y="0" width="80" height="32" rx="7" fill="rgba(255,255,255,0.18)"/>
          </g>
          <rect x="58" y="7" width="64" height="18" rx="4" fill="rgba(216, 159, 224, 0.3)"/>
          <text x="90" y="20" fill="#fff" font-family="dinmedium, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle">INSIGHT</text>
          <!-- Checkmark (moved up to avoid line intersection) -->
          <!-- Opaque backdrop behind checkmark -->
          <circle cx="145" cy="10" r="12" fill="rgba(111, 45, 189, 0.85)"/>
          <circle cx="145" cy="10" r="10" fill="rgba(255,255,255,0.15)"/>
          <circle cx="145" cy="10" r="9" fill="rgba(216, 159, 224, 0.2)"/>
          <path d="M140 10 L144 14 L151 6" stroke="#d89fe0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </g>

      </svg>
    </div>
  </div>
</div>
